<script>
/* Petit moteur qui remplace celui de Claude : lit les onglets publiés du tableau Google et redessine la page */
(function () {
  const GIDS = {lignes_gs: 1, achats_gs: 3, histo_gs: 8, marche_gs: 5, suivi_gs: 6};
  const SKIP = {lignes_gs: 3};
  const L = {}, C = {}, Dr = {}, data = {};
  let params = {horizon: 12, mensuel: 200};
  try { const p = JSON.parse(localStorage.getItem('pf-params') || 'null'); if (p) Object.assign(params, p); } catch (e) {}
  const runDraw = (name) => {
    const d = Dr[name]; if (!d) return;
    document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => {
      if (el.closest('[hidden]')) return;
      try { if (d.mount && !el.__pfm) el.__pfm = d.mount(el) || true; (d.update || (() => {}))(el, el.__pfm); } catch (e) { console.error('dessin', name, e); }
    });
  };
  const runAll = () => Object.keys(Dr).forEach(runDraw);
  const computeCalcs = () => {
    const done = {};
    const get = (id) => {
      if (C[id]) {
        if (done[id]) return done[id];
        const ins = C[id].inputs.map(get);
        let st = 'ok';
        for (const i of ins) if (i.status !== 'ok') { st = i.status === 'error' ? 'error' : 'loading'; break; }
        let res = {status: st, data: null};
        if (st === 'ok') { try { res = {status: 'ok', data: C[id].fn(...ins.map((i) => i.data))}; } catch (e) { console.error('calcul', id, e); res = {status: 'error', data: null}; } }
        done[id] = res; data[id] = res; return res;
      }
      return data[id] || {status: 'loading', data: []};
    };
    Object.keys(C).forEach(get);
  };
  window.dash = {
    colors: ['var(--pf-accent)'],
    loader(id, o) { L[id] = o; }, calc(id, o) { C[id] = o; },
    draw(name, f) { if (f === undefined) { runDraw(name); return; } Dr[name] = typeof f === 'function' ? {update: f} : f; },
    data(id) { return data[id] || {status: 'loading', data: C[id] ? null : []}; },
    onData() {}, params() { return Object.assign({}, params); },
    setParams(o) { Object.assign(params, o); try { localStorage.setItem('pf-params', JSON.stringify(params)); } catch (e) {} computeCalcs(); runAll(); },
    resetParams() {}, setLink() { setTimeout(runAll, 0); }, refresh() { load(); }
  };
  let publicationKey;
  function saveKey(key) {
    publicationKey = key;
    try { localStorage.setItem('pf-pub', key); } catch (e) {}
  }
  const getKey = () => {
    const match = location.hash.match(/k=([A-Za-z0-9_-]{20,})/);
    if (match) {
      saveKey(match[1]);
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (publicationKey) return publicationKey;
    try { return localStorage.getItem('pf-pub'); } catch (e) { return null; }
  };
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('pf-setup-form');
    const input = document.getElementById('pf-setup-link');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const match = input.value.trim().match(/#k=([A-Za-z0-9_-]{20,})(?:&|$)/);
      if (!match) {
        input.setCustomValidity('Colle le lien personnel complet de ton portefeuille.');
        input.reportValidity();
        return;
      }
      saveKey(match[1]);
      form.reset();
      load();
    });
    input.addEventListener('input', () => input.setCustomValidity(''));
  });
  let loading = false;
  async function load() {
    const key = getKey();
    const setup = document.getElementById('pf-setup');
    setup.hidden = Boolean(key);
    document.getElementById('dash-root').hidden = !key;
    if (!key) return;
    if (loading) return; loading = true;
    const maj = document.getElementById('pf-maj'); if (maj) maj.textContent = 'Mise à jour…';
    await Promise.all(Object.entries(GIDS).map(async ([id, gid]) => {
      try {
        const r = await fetch('https://docs.google.com/spreadsheets/d/e/' + key + '/pub?gid=' + gid + '&single=true&output=csv&_=' + Date.now(), {cache: 'no-store'});
        if (!r.ok) throw new Error('HTTP ' + r.status);
        let text = await r.text();
        // Google renvoie parfois « Chargement en cours… » ou un historique vide : on garde alors la dernière bonne version
        const lines = text.split('\n').length;
        const bad = /Chargement en cours|Loading\.\.\.|#N\/A/.test(text) || (id === 'histo_gs' && lines < 10);
        let prev = null; try { prev = localStorage.getItem('pf-csv-' + id); } catch (e) {}
        if (bad) { window.pfNeedRetry = true; if (prev) text = prev; } else { try { localStorage.setItem('pf-csv-' + id, text); } catch (e) {} }
        const rows = d3.csvParseRows(text).slice(SKIP[id] || 0);
        const res = L[id].fn({answer: {values: rows}});
        data[id] = {status: 'ok', data: Array.isArray(res) ? res : res.data};
      } catch (e) { console.error(id, e); if (!data[id] || data[id].status !== 'ok') data[id] = {status: 'error', data: []}; }
    }));
    computeCalcs(); runAll(); loading = false;
    if (window.pfNeedRetry) { window.pfNeedRetry = false; setTimeout(load, 20000); }
    const ok = Object.keys(GIDS).every((id) => data[id] && data[id].status === 'ok');
    if (maj) maj.textContent = (ok ? 'Mis à jour à ' : 'Problème de connexion · dernière tentative à ') + new Date().toLocaleTimeString('fr-CH', {hour: '2-digit', minute: '2-digit'});
  }
  window.pfLoad = load;
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(runAll, 150); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
})();
</script>

<script>
// ---------- lecture du tableau Google ----------
window.pfNum = function (s) {
  if (s == null) return null;
  if (typeof s === 'number') return s;
  let t = String(s).trim();
  if (!t || t[0] === '#') return null;
  const pct = t.endsWith('%');
  t = t.replace(/[%\s  '’]/g, '').replace(',', '.').replace('−', '-');
  const n = Number(t);
  if (!isFinite(n)) return null;
  return pct ? n / 100 : n;
};
window.pfDate = function (s) {
  if (!s) return null;
  const t = String(s).trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = t.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return null;
};
window.pfValues = function (answer) {
  let a = answer;
  if (typeof a === 'string') { try { a = JSON.parse(a); } catch (e) { throw new Error(a.slice(0, 300)); } }
  if (a && a.content) a = a.content;
  if (a && a.error) throw new Error(typeof a.error === 'string' ? a.error : (a.error.message || 'Erreur Google Sheets'));
  return (a && a.values) || [];
};

dash.loader('lignes_gs', {
  description: "Lit l'onglet « Mes actions » : une ligne par action, avec les colonnes du tableau.",
  fn: ({answer}) => {
    const v = window.pfValues(answer);
    const N = window.pfNum;
    const rows = [];
    for (let i = 1; i < v.length; i++) {
      const r = v[i] || [];
      if (!r[0] || !r[1]) continue;
      rows.push({nom: r[0], ticker: r[1], devise: r[2] || 'USD', cotee: r[3] || r[2] || 'USD', manuel: r[4] ? 1 : 0,
        quantite: N(r[5]), prix_moyen: N(r[6]), prix: N(r[7]), pct: N(r[8]), valeur_devise: N(r[9]), taux_chf: N(r[10]),
        valeur_chf: N(r[11]), investi_chf: N(r[12]), gain_chf: N(r[13]), gain_pct: N(r[14]), jour: N(r[15]), site: (r[16] || '').trim()});
    }
    return {data: rows, columns: ['nom', 'ticker', 'devise', 'cotee', 'manuel', 'quantite', 'prix_moyen', 'prix', 'pct', 'valeur_devise', 'taux_chf', 'valeur_chf', 'investi_chf', 'gain_chf', 'gain_pct', 'jour']};
  }
});

dash.loader('achats_gs', {
  description: "Lit l'onglet « Achats » : date, ticker, quantité, prix, devise et coût en francs (frais compris).",
  fn: ({answer}) => {
    const v = window.pfValues(answer);
    const N = window.pfNum;
    const rows = [];
    for (let i = 1; i < v.length; i++) {
      const r = v[i] || [];
      const d = window.pfDate(r[0]);
      if (!d || !r[2]) continue;
      rows.push({date: d, nom: r[1], ticker: r[2], quantite: N(r[3]), prix: N(r[4]), devise: r[5] || 'USD', cout_devise: N(r[7]), cout_chf: N(r[8]), frais: N(r[9]) || 0});
    }
    return {data: rows, columns: ['date', 'nom', 'ticker', 'quantite', 'prix', 'devise', 'cout_devise', 'cout_chf', 'frais']};
  }
});

dash.loader('histo_gs', {
  description: "Lit l'onglet « Historique » : cours de clôture de chaque action et taux de change, jour par jour.",
  fn: ({answer}) => {
    const v = window.pfValues(answer);
    const head = v[0] || [];
    const rows = [];
    for (let c = 0; c < head.length; c += 3) {
      const sym = head[c];
      if (!sym) continue;
      const key = sym === 'CURRENCY:USDCHF' ? 'USDCHF' : sym === 'CURRENCY:EURCHF' ? 'EURCHF' : sym;
      for (let i = 2; i < v.length; i++) {
        const r = v[i] || [];
        const d = window.pfDate(r[c]);
        const x = window.pfNum(r[c + 1]);
        if (d && x != null) rows.push({ticker: key, date: d, close: x});
      }
    }
    return {data: rows, columns: ['ticker', 'date', 'close']};
  }
});

dash.loader('marche_gs', {

  fn: ({answer}) => {

    const rows = [];
    for (let i = 1; i < v.length; i++) {
      const r = v[i] || [];
      if (!r[1]) continue;
      const pc = (x) => (N(x) == null ? null : Math.round(N(x) * 10000) / 100);
      rows.push({indice: r[0], ticker: r[1], niveau: N(r[2]), jour: pc(r[3]), mois: pc(r[5]), plus_haut: N(r[6]), ecart: pc(r[7])});

dash.loader('suivi_gs', {
  description: "Lit l'onglet « Suivi » : la valeur du portefeuille et de chaque action, relevée toutes les heures quand la bourse est ouverte.",
  fn: ({answer}) => {
    const v = window.pfValues(answer), N = window.pfNum;
    const head = v[0] || [];
    const rows = [];
    for (let i = 3; i < v.length; i++) {
      const r = v[i] || [];
      const ts = String(r[0] || '').trim();
      if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(ts)) continue;
      const t = ts.slice(0, 16);

      for (let c = 3; c < head.length; c += 2) {
        if (!head[c] || N(r[c]) == null || N(r[c]) === 0) continue;
        rows.push({symbol: head[c], ts: t, valeur_chf: N(r[c]), investi_chf: N(r[c + 1])});
      }
    }
    return {data: rows, columns: ['symbol', 'ts', 'valeur_chf', 'investi_chf']};

// ---------- calculs ----------
dash.calc('change', {
  title: 'Taux de change',
  description: "Dollar et euro en francs suisses, chaque jour (Google Finance). Si l'historique manque, on prend le taux du jour du tableau.",
  inputs: ['histo_gs', 'lignes_gs'],
  fn: (histo, lignes) => {
    const usd = new Map(), eur = new Map();
    for (const h of histo) { if (h.ticker === 'USDCHF') usd.set(h.date, h.close); else if (h.ticker === 'EURCHF') eur.set(h.date, h.close); }
    const dates = [...new Set([...usd.keys(), ...eur.keys()])].sort();
    let lu = null, le = null;
    const out = dates.map((date) => { if (usd.has(date)) lu = usd.get(date); if (eur.has(date)) le = eur.get(date); return {date, usdchf: lu, eurchf: le}; });
    const nowU = (lignes.find((l) => l.devise === 'USD' && l.taux_chf) || {}).taux_chf;
    const nowE = (lignes.find((l) => l.devise === 'EUR' && l.taux_chf) || {}).taux_chf;
    if (!out.length && (nowU || nowE)) out.push({date: new Date().toISOString().slice(0, 10), usdchf: nowU || 0.84, eurchf: nowE || 0.93});
    return out;
  }
});

window.pfFx = function (fx, date) {
  let best = fx[0];
  for (const r of fx) { if (r.date <= date) best = r; else break; }
  return best ? {usd: best.usdchf, eur: best.eurchf, CHF: 1, USD: best.usdchf, EUR: best.eurchf} : {usd: 1, eur: 1, CHF: 1, USD: 1, EUR: 1};
};

dash.calc('lignes', {
  title: 'Mes lignes',
  description: "Chaque action telle que le tableau la calcule, avec la valeur et le gain convertis en euros et en dollars au taux du jour.",
  inputs: ['lignes_gs', 'change'],
  fn: (lignes, change) => {
    if (!lignes.length || !change || !change.length) return [];
    const now = window.pfFx(change, '9999-12-31');
    const r2 = (x) => (x == null ? null : Math.round(x * 100) / 100);
    const out = lignes.filter((l) => l.quantite).map((l) => ({
      symbol: l.ticker, nom: l.nom, site: l.site, devise: l.devise, manuel: l.manuel, prix: l.prix, prix_moyen: l.prix_moyen,
      pct: r2(l.pct * 100), jour: l.jour == null ? null : r2(l.jour * 100),
      valeur_chf: r2(l.valeur_chf), valeur_eur: r2(l.valeur_chf / now.eur), valeur_usd: r2(l.valeur_chf / now.usd),
      gain_chf: r2(l.gain_chf), gain_eur: r2(l.gain_chf / now.eur), gain_usd: r2(l.gain_chf / now.usd),
      investi_chf: r2(l.investi_chf), jour_chf: l.jour == null ? 0 : r2(l.valeur_chf * l.jour / (1 + l.jour))}));
    out.sort((a, b) => b.valeur_chf - a.valeur_chf);
    return out;
  }
});

dash.calc('total', {
  title: 'Total du portefeuille',
  description: "Somme de toutes les lignes en francs, euros et dollars, gain réel (frais compris) et variation du jour.",
  inputs: ['lignes', 'change'],
  fn: (lignes, change) => {
    if (!lignes || !lignes.length || !change || !change.length) return [];
    const now = window.pfFx(change, '9999-12-31');
    let v = 0, inv = 0, j = 0;
    for (const l of lignes) { v += l.valeur_chf || 0; inv += l.investi_chf || 0; j += l.jour_chf || 0; }
    const r2 = (x) => Math.round(x * 100) / 100;
    const g = v - inv;
    const date = change[change.length - 1].date;
    return [{valeur_chf: r2(v), valeur_eur: r2(v / now.eur), valeur_usd: r2(v / now.usd),
      investi_chf: r2(inv), investi_eur: r2(inv / now.eur), investi_usd: r2(inv / now.usd),
      gain_chf: r2(g), gain_eur: r2(g / now.eur), gain_usd: r2(g / now.usd), pct: r2((g / inv) * 100),
      jour_chf: r2(j), jour_eur: r2(j / now.eur), jour_usd: r2(j / now.usd), date, usdchf: now.usd, eurchf: now.eur}];
  }
});

dash.calc('historique', {
  title: 'Courbes jour par jour',
  description: "Pour chaque jour de bourse depuis ton premier achat : le % de chaque action par rapport à ton prix moyen de ce jour-là, et la valeur du portefeuille comparée à l'argent investi (frais compris), en francs.",
  inputs: ['achats_gs', 'histo_gs', 'change', 'lignes_gs'],
  fn: (achats, histo, change, lignes) => {
    if (!achats.length || !histo.length || !change || !change.length) return [];
    const info = new Map(lignes.map((l) => [l.ticker, l]));
    const start = achats.reduce((m, a) => (a.date < m ? a.date : m), '9999');
    const px = new Map();
    for (const h of histo) { if (h.ticker === 'USDCHF' || h.ticker === 'EURCHF') continue; if (!px.has(h.ticker)) px.set(h.ticker, new Map()); px.get(h.ticker).set(h.date, h.close); }
    const dates = [...new Set(histo.filter((h) => h.ticker !== 'USDCHF' && h.ticker !== 'EURCHF' && h.date >= start).map((h) => h.date))].sort();
    const tickers = [...new Set(achats.map((a) => a.ticker))];
    const last = new Map();
    const r2 = (x) => Math.round(x * 100) / 100;
    const out = [];
    for (const d of dates) {
      const f = window.pfFx(change, d);
      let tv = 0, ti = 0;
      for (const t of tickers) {
        const held = achats.filter((a) => a.ticker === t && a.date <= d);
        if (!held.length) continue;
        const l = info.get(t) || {};
        const dev = l.devise || held[0].devise, cot = l.cotee || dev;
        const q = held.reduce((s, a) => s + a.quantite, 0);
        const cost = held.reduce((s, a) => s + a.cout_devise, 0);
        const costChf = held.reduce((s, a) => s + (a.cout_chf || 0), 0);
        ti += costChf;
        let p = px.get(t) && px.get(t).get(d);
        if (p != null) last.set(t, p);
        const use = p != null ? p : (last.has(t) ? last.get(t) : (l.manuel ? l.prix : null));
        if (use == null) { tv += costChf; continue; }
        const inDev = cot === dev ? use : use * (f[cot] || 1) / (f[dev] || 1);
        tv += q * inDev * (f[dev] || 1);
        if (p != null) { const b = held.filter((a) => a.date === d); out.push({symbol: t, date: d, prix: r2(inDev), pct: r2((inDev / (cost / q) - 1) * 100), valeur_chf: r2(q * inDev * (f[dev] || 1)), investi_chf: r2(costChf), achat: b.length ? 1 : 0, achats: b.length ? 'achat de ' + new Intl.NumberFormat('fr-CH', {maximumFractionDigits: 2}).format(b.reduce((s, a) => s + (a.cout_chf || 0), 0)) + ' CHF' : ''}); }
      }
      const bought = achats.filter((a) => a.date === d);
      out.push({symbol: 'TOTAL', date: d, prix: null, pct: r2((tv / ti - 1) * 100), valeur_chf: r2(tv), investi_chf: r2(ti), usdchf: f.usd, eurchf: f.eur, achat: bought.length ? 1 : 0, achats: [...new Set(bought.map((a) => (info.get(a.ticker) || {}).nom || a.nom || a.ticker))].join(', ')});
    }
    return out;
  }
});

// ---------- projection ----------
dash.calc('projection', {
  title: 'Projection',
  description: "Trois scénarios mois par mois, en francs : normal à +7 % par an, pessimiste et optimiste selon les variations observées depuis tes achats (environ 2 chances sur 3 de finir entre les deux). L'argent ajouté chaque mois est compté dans l'investi.",
  inputs: ['historique', 'lignes', 'total'],
  fn: (hist, lignes, total) => {
    if (!hist || !hist.length || !lignes || !lignes.length || !total || !total.length) return [];
    const p = dash.params();
    const H = [6, 12, 36, 60].includes(Number(p.horizon)) ? Number(p.horizon) : 12;
    const C = isFinite(Number(p.mensuel)) && Number(p.mensuel) >= 0 ? Number(p.mensuel) : 200;
    const MU = 0.07;
    const sigmaOf = (vals) => {
      const r = [];
      for (let i = 1; i < vals.length; i++) if (vals[i - 1] > 0 && vals[i] > 0) r.push(Math.log(vals[i] / vals[i - 1]));
      if (r.length < 10) return 0.3;
      const m = r.reduce((a, b) => a + b, 0) / r.length;
      const sd = Math.sqrt(r.reduce((a, b) => a + (b - m) * (b - m), 0) / (r.length - 1));
      return Math.min(1.2, Math.max(0.1, sd * Math.sqrt(252)));
    };
    const subjects = [{sujet: 'TOTAL', v0: total[0].valeur_chf, i0: total[0].investi_chf, vals: hist.filter((h) => h.symbol === 'TOTAL').map((h) => 1 + h.pct / 100)}]
      .concat(lignes.map((l) => ({sujet: l.symbol, v0: l.valeur_chf, i0: l.investi_chf, vals: hist.filter((h) => h.symbol === l.symbol).map((h) => h.prix)})));
    const out = [];
    const r2 = (x) => Math.round(x * 100) / 100;
    for (const s of subjects) {
      if (s.v0 == null) continue;
      const sig = sigmaOf(s.vals);
      const T = H / 12;
      const rate = (z) => Math.pow(Math.exp(Math.log(1 + MU) + z * sig / Math.sqrt(T)), 1 / 12) - 1;
      const rp = rate(-1), rn = rate(0), ro = rate(1);
      let vp = s.v0, vn = s.v0, vo = s.v0, inv = s.i0;
      for (let m = 0; m <= H; m++) {
        out.push({sujet: s.sujet, mois: m, pessimiste: r2(vp), normal: r2(vn), optimiste: r2(vo), investi: r2(inv), volatilite: r2(sig * 100)});
        vp = vp * (1 + rp) + C; vn = vn * (1 + rn) + C; vo = vo * (1 + ro) + C; inv += C;
      }
    }
    return out;
  }
});

dash.calc('projection_fin', {
  title: 'Projection : résultat final',
  description: "Le dernier mois de chaque projection, converti en euros et en dollars au taux du jour.",
  inputs: ['projection', 'total'],
  fn: (proj, total) => {
    if (!proj || !proj.length || !total || !total.length) return [];
    const eur = total[0].eurchf, usd = total[0].usdchf;
    const last = new Map();
    for (const r of proj) { const p = last.get(r.sujet); if (!p || r.mois > p.mois) last.set(r.sujet, r); }
    const r2 = (x) => Math.round(x * 100) / 100;
    const out = [];
    for (const r of last.values()) {
      const row = {sujet: r.sujet, mois: r.mois, volatilite: r.volatilite};
      for (const k of ['pessimiste', 'normal', 'optimiste', 'investi']) { row[k + '_chf'] = r[k]; row[k + '_eur'] = r2(r[k] / eur); row[k + '_usd'] = r2(r[k] / usd); }
      out.push(row);
    }
    return out;
  }
});

// ---------- périodes ----------
dash.calc('periodes', {
  title: 'Gain ou perte par période',
  description: "Pour le portefeuille et chaque action : ce que tu as gagné ou perdu depuis la dernière clôture (24 h), l'avant-dernière (48 h), 7 jours, 1 mois et depuis le début. L'argent ajouté pendant la période n'est pas compté comme un gain : gain = valeur maintenant − valeur au début de la période − argent ajouté.",
  inputs: ['historique', 'lignes', 'total'],
  fn: (hist, lignes, total) => {
    if (!hist || !hist.length || !lignes || !lignes.length || !total || !total.length) return [];
    const eur = total[0].eurchf, usd = total[0].usdchf;
    const ago = (n) => { const d = new Date(); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); };
    const P = [['1j', 1], ['2j', 2], ['7j', 7], ['1m', 30], ['tout', null]];
    const today = new Date().toISOString().slice(0, 10);
    const r2 = (x) => Math.round(x * 100) / 100;
    const subj = [{symbol: 'TOTAL', v: total[0].valeur_chf, i: total[0].investi_chf, manuel: 0}].concat(lignes.map((l) => ({symbol: l.symbol, v: l.valeur_chf, i: l.investi_chf, manuel: l.manuel})));
    const first = hist.reduce((m, h) => (h.date < m ? h.date : m), '9999');
    return subj.map((s) => {
      const rows = hist.filter((h) => h.symbol === s.symbol).sort((a, b) => (a.date < b.date ? -1 : 1));
      const out = {symbol: s.symbol};
      for (const [key, n] of P) {
        let vs = 0, is = 0, depuis = first;
        if (n != null) {
          let st = null, lim;
          if (n <= 2) {
            // 24 h = depuis la dernière clôture, 48 h = depuis l'avant-dernière (jours de bourse)
            let past = rows.filter((r) => r.date < today);
            // bourse fermée depuis la dernière clôture : on compare avec la séance d'avant
            if (past.length > 1 && s.v && Math.abs(s.v - past[past.length - 1].valeur_chf) <= Math.max(0.01, 0.0005 * s.v)) past = past.slice(0, -1);
            st = past.length >= n ? past[past.length - n] : null;
            lim = st ? st.date : ago(n);
          } else {
            lim = ago(n);
            for (const r of rows) { if (r.date <= lim) st = r; else break; }
          }
          depuis = lim;
          if (st) { vs = st.valeur_chf; is = st.investi_chf; depuis = st.date; }
          else if (s.manuel && s.symbol !== 'TOTAL') { vs = s.v; is = s.i; }
        }
        const added = s.i - is;
        const gain = s.v - vs - added;
        const base = vs + added;
        out['depuis_' + key] = depuis;
        out['gain_' + key + '_chf'] = r2(gain); out['gain_' + key + '_eur'] = r2(gain / eur); out['gain_' + key + '_usd'] = r2(gain / usd);
        out['pct_' + key] = base > 0 ? r2((gain / base) * 100) : 0;
      }
      return out;
    });
  }
});

<script>
// ---------- formatting helpers ----------
window.pfFmt = {
  sym: {CHF: 'CHF', EUR: '€', USD: '$'},
  key: {CHF: 'chf', EUR: 'eur', USD: 'usd'},
  money(v, cur, signed) {
    const s = new Intl.NumberFormat('fr-CH', {minimumFractionDigits: 2, maximumFractionDigits: 2}).format(Math.abs(v));
    const sign = signed ? (v >= 0 ? '+' : '−') : (v < 0 ? '−' : '');
    return sign + s + ' ' + this.sym[cur];
  },
  pct(v) { return (v >= 0 ? '+' : '−') + new Intl.NumberFormat('fr-CH', {minimumFractionDigits: 2, maximumFractionDigits: 2}).format(Math.abs(v)) + ' %'; },
  date(d) { if (!d) return ''; const [y, m, j] = d.split('-'); return j + '.' + m + '.' + y; },
  span(text, src, field, where, cls) {
    const s = document.createElement('span');
    s.textContent = text; s.setAttribute('data-source', src); s.setAttribute('data-field', field);
    if (where != null) { if (typeof where === 'number') s.setAttribute('data-row', String(where)); else s.setAttribute('data-where', where); }
    if (cls) s.className = cls;
    return s;
  }
};
window.pfMoneyCell = function (row, base) { const cur = window.pfState.cur; return {v: row[base + '_' + window.pfFmt.key[cur]], field: base + '_' + window.pfFmt.key[cur], cur}; };

function pfTotalTile(base, signed, withClass) {
  return (el) => {
    const t = dash.data('total');
    if (t.status !== 'ok' || !t.data || !t.data.length) { el.textContent = '—'; if (t.status === 'loading') el.classList.add('dash-skeleton'); else el.classList.remove('dash-skeleton'); return; }
    el.classList.remove('dash-skeleton');
    const m = window.pfMoneyCell(t.data[0], base);
    const cls = withClass ? (m.v >= 0 ? 'pf-up' : 'pf-down') : '';
    el.replaceChildren(window.pfFmt.span(window.pfFmt.money(m.v, m.cur, signed), 'total', m.field, 0, cls));
  };
}
dash.draw('t-valeur', pfTotalTile('valeur', false, false));
dash.draw('t-gain', pfTotalTile('gain', true, true));
dash.draw('t-investi', pfTotalTile('investi', false, false));
window.pfPerRow = function (sym) {
  const p = dash.data('periodes');
  return p.status === 'ok' && p.data ? p.data.find((r) => r.symbol === sym) : null;
};
dash.draw('t-per-lab', (el) => {
  const per = window.pfState.per;
  el.textContent = per === 'tout' ? 'Depuis le début' : 'Depuis ' + window.pfPerTxt[per];
});
dash.draw('t-per', (el) => {

  if (!r) { el.textContent = '—'; return; }
  const F = window.pfFmt, cur = window.pfState.cur, per = window.pfState.per;

  el.replaceChildren(F.span(F.money(r[f], cur, true), 'periodes', f, 'symbol=TOTAL', r[f] >= 0 ? 'pf-up' : 'pf-down'));

dash.draw('t-per-sub', (el) => {
  const r = window.pfPerRow('TOTAL');
  if (!r) { el.textContent = '—'; return; }
  const F = window.pfFmt, per = window.pfState.per;
  const d = r['depuis_' + per];
  el.replaceChildren(F.span(F.pct(r['pct_' + per]), 'periodes', 'pct_' + per, 'symbol=TOTAL', r['pct_' + per] >= 0 ? 'pf-up' : 'pf-down'),
    document.createTextNode(''));
});

dash.draw('t-gainpct', (el) => {

  const vixScore = !vix || vix.niveau == null ? 0 : vix.niveau < 20 ? 0 : vix.niveau < 30 ? 1 : 2;

// draws value vs invested with the gap shaded green (gain) or red (loss)
window.pfGapChart = function (el, series, opts) {
  const F = window.pfFmt, cur = window.pfState.cur;

    .attr('role', 'img').attr('aria-label', opts.label);
  const probe = svg.append('g'); let ml = 0;
  const yTick = (v) => new Intl.NumberFormat('fr-CH', {maximumFractionDigits: 0}).format(v) + ' ' + F.sym[cur];
  y.ticks(5).forEach((t) => { ml = Math.max(ml, probe.append('text').text(yTick(t)).node().getComputedTextLength()); });
  probe.remove();

  y.range([H - m.b, m.t]);
  svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - m.l - m.r)).tickFormat(yTick)).call((g) => g.selectAll('.tick text').attr('x', -6));
  const nT = Math.max(2, Math.floor((W - m.l - m.r) / 150));
  const xAxis = svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).ticks(nT).tickSize(0).tickPadding(8).tickFormat(opts.intraday ? window.pfFr.utcFormat('%-d %b, %H h') : window.pfLongDate));
  xAxis.selectAll('.tick text').each(function () { const bb = this.getBBox(); const tx = this.parentNode.transform.baseVal.consolidate(); const cx = tx ? tx.matrix.e : 0; if (cx + bb.x < 0 || cx + bb.x + bb.width > W) this.remove(); });
  const uid = 'pf' + Math.random().toString(36).slice(2, 8);
  const defs = svg.append('defs');
  defs.append('clipPath').attr('id', uid + 'a').append('path').datum(series).attr('d', d3.area().x((s) => x(s.d)).y0(0).y1((s) => y(s.inv)));
  defs.append('clipPath').attr('id', uid + 'b').append('path').datum(series).attr('d', d3.area().x((s) => x(s.d)).y0(H).y1((s) => y(s.inv)));
  const band = d3.area().x((s) => x(s.d)).y0((s) => y(s.inv)).y1((s) => y(s.v));
  svg.append('path').datum(series).attr('d', band).attr('clip-path', `url(#${uid}a)`).style('fill', 'var(--color-ok)').style('opacity', 0.18);
  svg.append('path').datum(series).attr('d', band).attr('clip-path', `url(#${uid}b)`).style('fill', 'var(--color-bad)').style('opacity', 0.18);
  svg.append('path').datum(series).attr('fill', 'none').style('stroke', 'var(--color-fg-muted)').style('stroke-width', 1.5).style('stroke-dasharray', '5 4')
    .attr('d', d3.line().curve(d3.curveStepAfter).x((s) => x(s.d)).y((s) => y(s.inv)));
  svg.append('path').datum(series).attr('fill', 'none').style('stroke', 'var(--pf-accent)').style('stroke-width', 2).style('stroke-linejoin', 'round').style('stroke-linecap', 'round')
    .attr('d', d3.line().x((s) => x(s.d)).y((s) => y(s.v)));
  const buys = series.filter((s) => s.achat);
  svg.selectAll('line.buy').data(buys).join('line').attr('class', 'buy').attr('x1', (s) => x(s.d)).attr('x2', (s) => x(s.d)).attr('y1', (s) => y(s.v)).attr('y2', H - m.b)
    .style('stroke', 'var(--color-fg-muted)').style('stroke-width', 1).style('stroke-dasharray', '2 3').style('opacity', 0.6);
  svg.selectAll('circle.buy').data(buys).join('circle').attr('class', 'buy').attr('cx', (s) => x(s.d)).attr('cy', (s) => y(s.v)).attr('r', 6)
    .style('fill', 'var(--color-panel)').style('stroke', 'var(--pf-accent)').style('stroke-width', 3);
  const ls = series[series.length - 1];
  svg.append('circle').attr('cx', x(ls.d)).attr('cy', y(ls.v)).attr('r', 4.5).style('fill', 'var(--pf-accent)').style('stroke', 'var(--color-panel)').style('stroke-width', 2);

  const lg = document.createElement('div'); lg.className = 'pf-legend';
  const key = (color, dashd, text) => { const k = document.createElement('span'); const s = document.createElement('span'); s.className = 'pf-key'; s.style.borderTopColor = color; if (dashd) s.style.borderTopStyle = 'dashed'; k.append(s, document.createTextNode(text)); return k; };
  const sw = (color, text) => { const k = document.createElement('span'); const s = document.createElement('span'); s.className = 'pf-scen-key'; s.style.background = color; s.style.opacity = '0.45'; s.style.borderRadius = '2px'; k.append(s, document.createTextNode(text)); return k; };
  const ring = () => { const k = document.createElement('span'); const s = document.createElement('span'); s.className = 'pf-scen-key'; s.style.background = 'var(--color-panel)'; s.style.border = '3px solid ' + 'var(--pf-accent)'; s.style.width = '8px'; s.style.height = '8px'; k.append(s, document.createTextNode('Achat')); return k; };
  lg.append(key('var(--pf-accent)', false, opts.valueLabel), key('var(--color-fg-muted)', true, 'Argent investi'), ring(), sw('var(--color-ok)', 'En gain'), sw('var(--color-bad)', 'En perte'));
  el.append(lg);

  const tip = document.createElement('div'); tip.className = 'pf-tip'; tip.hidden = true; el.append(tip);
  const dot = svg.append('circle').attr('r', 4).style('fill', 'var(--color-fg)').style('display', 'none');
  const bis = d3.bisector((s) => s.d).center;
  const show = (ev) => {
      const [px] = d3.pointer(ev, svg.node());
      const s = series[bis(series, x.invert(px))];
      dot.style('display', null).attr('cx', x(s.d)).attr('cy', y(s.v));
      const g = s.v - s.inv;
      const l1 = document.createElement('div'); l1.className = 'pf-tip-d'; l1.textContent = s.now ? 'Maintenant' : s.close ? 'Clôture du ' + window.pfLongDate(s.d) : opts.intraday ? hourFmt(s.d) : window.pfLongDate(s.d);
      const l0 = document.createElement('div'); l0.style.fontWeight = '600'; l0.textContent = s.achat ? 'Achat : ' + (s.achats || 'oui') : '';

      tip.style.left = Math.min(Math.max(0, sx - tw / 2), bw - tw) + 'px';
      tip.style.top = Math.max(0, (y(s.v) / H) * el.querySelector('svg').getBoundingClientRect().height - 110) + 'px';
  };

};

dash.draw('chart', (el) => {
  const h = dash.data('historique');
  el.replaceChildren();
  if (h.status !== 'ok' || !h.data) {
    const p = document.createElement('div');
    if (h.status === 'error') { p.className = 'pf-fail'; p.textContent = 'Les cours ne se sont pas chargés.'; } else { p.className = 'dash-skeleton'; p.style.height = '280px'; }
    el.append(p); return;
  }
  const sel = window.pfState.sel, cur = window.pfState.cur;
  const fxBy = new Map(h.data.filter((r) => r.symbol === 'TOTAL').map((r) => [r.date, r]));
  const conv = (date, v) => { const f = fxBy.get(date); if (!f || cur === 'CHF') return v; return cur === 'EUR' ? v / f.eurchf : v / f.usdchf; };
  const pr = window.pfPerRow(sel || 'TOTAL');
  const depuis = pr ? pr['depuis_' + window.pfState.per] : null;
  const rows = h.data.filter((r) => r.symbol === (sel || 'TOTAL') && (!depuis || r.date >= depuis));
  const series = rows.map((r) => ({date: r.date, v: conv(r.date, r.valeur_chf), inv: conv(r.date, r.investi_chf), achat: r.achat, achats: r.achats || ''}));
  // point « maintenant » avec les cours du moment
  const live = sel ? (dash.data('lignes').data || []).find((x) => x.symbol === sel) : (dash.data('total').data || [])[0];
  const tt = (dash.data('total').data || [])[0];
  if (live && tt && live.valeur_chf != null) {
    const today = new Date().toISOString().slice(0, 10);
    const rate = cur === 'CHF' ? 1 : cur === 'EUR' ? tt.eurchf : tt.usdchf;
    while (series.length && series[series.length - 1].date >= today) series.pop();
    series.push({date: today, v: live.valeur_chf / rate, inv: live.investi_chf / rate, achat: 0, now: 1});
  }
  // 24 h / 48 h : un point par heure grâce aux relevés horaires
  const per = window.pfState.per;
  let intraday = false, ser = series;
  if ((per === '1j' || per === '2j') && depuis) {
    const su = dash.data('suivi_gs');
    const nowD = new Date();
    const naive = (d) => new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes()));
    const pts = (su.status === 'ok' && su.data ? su.data : []).filter((r) => r.symbol === (sel || 'TOTAL') && r.ts.slice(0, 10) > depuis);
    const tt2 = (dash.data('total').data || [])[0];
    const rate = cur === 'CHF' ? 1 : tt2 ? (cur === 'EUR' ? tt2.eurchf : tt2.usdchf) : 1;
    const startRow = rows.find((r) => r.date === depuis);
    ser = [];
    if (startRow) ser.push({dt: new Date(Date.UTC(+depuis.slice(0, 4), +depuis.slice(5, 7) - 1, +depuis.slice(8, 10), 22, 0)), v: conv(depuis, startRow.valeur_chf), inv: conv(depuis, startRow.investi_chf), achat: 0, close: 1});
    for (const p of pts) ser.push({dt: d3.utcParse('%Y-%m-%d %H:%M')(p.ts), v: p.valeur_chf / rate, inv: p.investi_chf / rate, achat: 0});
    const nowPt = series.find((s) => s.now);
    if (nowPt) ser.push(Object.assign({}, nowPt, {dt: naive(nowD)}));
    ser = ser.filter((s) => s.dt).sort((a, b) => a.dt - b.dt);
    intraday = true;
  }
  if (ser.length < 2) { const p = document.createElement('div'); p.className = 'pf-fail'; p.textContent = sel ? 'Pas assez de cours pour tracer cette action.' : 'Pas encore de données.'; el.append(p); return; }
  window.pfGapChart(el, ser, {intraday, label: sel ? "Valeur de l'action comparée à l'argent investi" : "Valeur du portefeuille comparée à l'argent investi", valueLabel: sel ? 'Valeur de ta ligne' : 'Valeur du portefeuille'});
});

// ---------- table ----------
dash.draw('table', (el) => {
  const l = dash.data('lignes');
  if (l.status !== 'ok' || !l.data) {
    el.replaceChildren();
    const p = document.createElement('div'); p.className = l.status === 'error' ? 'pf-fail' : 'dash-skeleton'; if (l.status === 'error') p.textContent = 'Les lignes ne se sont pas chargées.'; else p.style.height = '200px';
    el.append(p); return;
  }
  const cur = window.pfState.cur, k = window.pfFmt.key[cur], F = window.pfFmt;
  const tbl = document.createElement('table'); tbl.className = 'pf-table';
  tbl.setAttribute('data-source', 'lignes'); tbl.setAttribute('data-row-key', 'symbol');
  const thead = document.createElement('thead'); const hr = document.createElement('tr');
  [['', 'nom'], [F.sym[cur], 'valeur_' + k], ['Total', 'pct'], ['Gain', 'gain_' + k]].forEach(([t, f]) => { const th = document.createElement('th'); th.textContent = t; th.setAttribute('data-field', f); hr.append(th); });
  const per = window.pfState.per, pl = per === 'tout' ? 'depuis le début' : 'depuis ' + window.pfPerTxt[per];
  [['Gain ' + window.pfPerTxt[per], 'gain_' + per + '_' + k], [per === 'tout' ? 'Debut' : window.pfPerTxt[per], 'pct_' + per]].forEach(([t, f]) => { const th = document.createElement('th'); th.textContent = t; th.setAttribute('data-field', f); th.setAttribute('data-source', 'periodes'); hr.append(th); });
  const perData = dash.data('periodes'); const perBy = new Map((perData.status === 'ok' && perData.data ? perData.data : []).map((x) => [x.symbol, x]));
  thead.append(hr);
  const tb = document.createElement('tbody');
  for (const r of l.data) {
    const tr = document.createElement('tr'); tr.className = 'pf-row' + (window.pfState.sel === r.symbol ? ' is-sel' : '');
    tr.setAttribute('data-key', encodeURIComponent(r.symbol)); tr.tabIndex = 0; tr.setAttribute('role', 'button');
    const c1 = document.createElement('td');
    if (r.site) {
      const box = document.createElement('span'); box.className = 'pf-logo'; box.title = r.nom;
      const im = document.createElement('img'); im.alt = r.nom; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer';
      im.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(r.site) + '&sz=128';
      im.onerror = () => { c1.textContent = window.pfPlain ? window.pfPlain(r.nom) : r.nom; };
      box.append(im); const cell = document.createElement('span'); cell.className = 'pf-logo-cell'; cell.append(box); c1.append(cell);
    } else c1.textContent = r.nom;
    const c2 = document.createElement('td'); c2.textContent = r['valeur_' + k] == null ? '—' : F.money(r['valeur_' + k], cur).replace(' ' + F.sym[cur], '');
    const c3 = document.createElement('td'); c3.textContent = r.pct == null ? '—' : F.pct(r.pct); if (r.pct != null) c3.className = r.pct >= 0 ? 'pf-up' : 'pf-down';
    const c4 = document.createElement('td'); c4.textContent = r['gain_' + k] == null ? '—' : F.money(r['gain_' + k], cur, true).replace(' ' + F.sym[cur], ''); if (r.gain_chf != null) c4.className = r.gain_chf >= 0 ? 'pf-up' : 'pf-down';
    const pp = perBy.get(r.symbol);
    const gv = pp ? pp['gain_' + per + '_' + k] : null, pv = pp ? pp['pct_' + per] : null;
    const c5 = document.createElement('td'); c5.textContent = gv == null ? '—' : F.money(gv, cur, true).replace(' ' + F.sym[cur], ''); if (gv != null) c5.className = gv >= 0 ? 'pf-up' : 'pf-down';
    const c6 = document.createElement('td'); c6.textContent = pv == null ? '—' : F.pct(pv); if (pv != null) c6.className = pv >= 0 ? 'pf-up' : 'pf-down';
    tr.append(c1, c2, c3, c4, c5, c6);
    const go = () => window.pfSelect(window.pfState.sel === r.symbol ? null : r.symbol);
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    tb.append(tr);
  }
  tbl.append(thead, tb);
  el.replaceChildren(tbl);
});
</script>

<script>
// ---------- projection : affichage ----------
window.pfHorizonTxt = {6: '6 mois', 12: '1 an', 36: '3 ans', 60: '5 ans'};
window.pfProjRow = function () {
  const pf = dash.data('projection_fin');
  if (pf.status !== 'ok' || !pf.data) return null;
  return pf.data.find((r) => r.sujet === (window.pfState.proj || 'TOTAL')) || pf.data.find((r) => r.sujet === 'TOTAL') || null;
};
window.pfProjName = function () {
  const s = window.pfState.proj || 'TOTAL';
  if (s === 'TOTAL') return null;
  const l = dash.data('lignes');
  const row = l.status === 'ok' && l.data ? l.data.find((x) => x.symbol === s) : null;
  return row ? row.nom : s;
};

dash.draw('proj-sujet', (sel) => {
  const l = dash.data('lignes');
  const opts = [new Option('Tout le portefeuille', 'TOTAL')];
  if (l.status === 'ok' && l.data) for (const r of l.data) opts.push(new Option(r.nom, r.symbol));
  sel.replaceChildren(...opts);
  sel.value = window.pfState.proj || 'TOTAL';
  sel.onchange = () => { window.pfState.proj = sel.value; ['proj-titre', 'proj-phrase', 'proj-tuiles', 'proj-chart'].forEach((n) => dash.draw(n)); };
});

dash.draw('proj-titre', (el) => {
  const n = window.pfProjName();
  const H = window.pfHorizonTxt[Number(dash.params().horizon)] || '1 an';
  el.textContent = (n ? n : 'Tout le portefeuille') + ' dans ' + H;
});

dash.draw('proj-phrase', (el) => {
  const r = window.pfProjRow();
  if (!r) { el.textContent = '—'; return; }
  const F = window.pfFmt, cur = window.pfState.cur, k = F.key[cur];
  const w = 'sujet=' + encodeURIComponent(r.sujet);
  const p = dash.params();
  const C = isFinite(Number(p.mensuel)) ? Number(p.mensuel) : 200;
  const H = window.pfHorizonTxt[r.mois] || (r.mois + ' mois');
  const n = window.pfProjName();
  const b = (txt, field) => { const s = F.span(txt, 'projection_fin', field, w); const x = document.createElement('b'); x.append(s); return x; };
  el.replaceChildren(
    document.createTextNode((C > 0 ? 'Si tu ajoutes ' + new Intl.NumberFormat('fr-CH').format(C) + ' CHF par mois, ' : 'Sans rien ajouter, ') + 'dans ' + H + ' ' + (n ? 'ta ligne ' + n : 'ton portefeuille') + ' vaudrait environ '),
    b(F.money(r['normal_' + k], cur), 'normal_' + k),
    document.createTextNode(' dans le scénario normal, entre '), b(F.money(r['pessimiste_' + k], cur), 'pessimiste_' + k),
    document.createTextNode(' et '), b(F.money(r['optimiste_' + k], cur), 'optimiste_' + k),
    document.createTextNode(' selon les marchés. Tu aurais mis '), b(F.money(r['investi_' + k], cur), 'investi_' + k),
    document.createTextNode(' au total.'));
});

dash.draw('proj-tuiles', (el) => {
  const r = window.pfProjRow();
  if (!r) { el.replaceChildren(); const s = document.createElement('div'); s.className = 'dash-skeleton'; s.style.height = '90px'; el.append(s); return; }
  const F = window.pfFmt, cur = window.pfState.cur, k = F.key[cur];
  const w = 'sujet=' + encodeURIComponent(r.sujet);
  const inv = r['investi_' + k];
  const tiles = [['Pessimiste', 'pessimiste', 'var(--color-bad)'], ['Normal', 'normal', 'var(--pf-accent)'], ['Optimiste', 'optimiste', 'var(--color-ok)'], ['Argent investi', 'investi', 'var(--color-fg-muted)']];
  el.replaceChildren(...tiles.map(([lab, key, col]) => {
    const t = document.createElement('div'); t.className = 'pf-tile';
    const l = document.createElement('div'); l.className = 'pf-lab'; const dot = document.createElement('span'); dot.className = 'pf-scen-key'; dot.style.background = col; l.append(dot, document.createTextNode(lab));
    const v = document.createElement('div'); v.className = 'pf-big'; v.append(F.span(F.money(r[key + '_' + k], cur), 'projection_fin', key + '_' + k, w));
    const s = document.createElement('div'); s.className = 'pf-sub';
    if (key !== 'investi') { const g = r[key + '_' + k] - inv; s.className = 'pf-sub ' + (g >= 0 ? 'pf-up' : 'pf-down'); s.textContent = (g >= 0 ? 'Gain ' : 'Perte ') + F.money(g, cur, true); }
    else s.textContent = 'Ce que tu aurais mis';
    t.append(l, v, s); return t;
  }));
});

dash.draw('proj-chart', (el) => {
  const pr = dash.data('projection'), tt = dash.data('total');
  el.replaceChildren();
  if (pr.status !== 'ok' || !pr.data || tt.status !== 'ok' || !tt.data || !tt.data.length) {
    const p = document.createElement('div'); if (pr.status === 'error') { p.className = 'pf-fail'; p.textContent = 'La projection ne s\'est pas calculée.'; } else { p.className = 'dash-skeleton'; p.style.height = '280px'; }
    el.append(p); return;
  }
  const F = window.pfFmt, cur = window.pfState.cur;
  const rate = cur === 'CHF' ? 1 : cur === 'EUR' ? tt.data[0].eurchf : tt.data[0].usdchf;
  const rows = pr.data.filter((r) => r.sujet === (window.pfState.proj || 'TOTAL'));
  if (rows.length < 2) { const p = document.createElement('div'); p.className = 'pf-fail'; p.textContent = 'Pas de projection pour cette action.'; el.append(p); return; }
  const now = new Date(); const base = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
  const S = rows.map((r) => ({d: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + r.mois, 1)), m: r.mois, p: r.pessimiste / rate, n: r.normal / rate, o: r.optimiste / rate, i: r.investi / rate}));
  const W = Math.max(280, el.clientWidth || 600), H = 320;
  const y = d3.scaleLinear().domain([Math.min(0, d3.min(S, (s) => Math.min(s.p, s.i))), d3.max(S, (s) => Math.max(s.o, s.i))]).nice(5);
  const svg = d3.select(el).append('svg').attr('width', '100%').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', 'Projection : trois scénarios et argent investi');
  const yTick = (v) => new Intl.NumberFormat('fr-CH', {maximumFractionDigits: 0}).format(v) + ' ' + F.sym[cur];
  const probe = svg.append('g'); let ml = 0; y.ticks(5).forEach((t) => { ml = Math.max(ml, probe.append('text').text(yTick(t)).node().getComputedTextLength()); }); probe.remove();
  const mg = {t: 10, r: 18, b: 28, l: Math.ceil(ml) + 10};
  const x = d3.scaleUtc().domain(d3.extent(S, (s) => s.d)).range([mg.l, W - mg.r]);
  y.range([H - mg.b, mg.t]);
  const monthFmt = window.pfFr.utcFormat('%B %Y');
  svg.append('g').attr('transform', `translate(${mg.l},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-(W - mg.l - mg.r)).tickFormat(yTick)).call((g) => g.selectAll('.tick text').attr('x', -6));
  const xa = svg.append('g').attr('transform', `translate(0,${H - mg.b})`).call(d3.axisBottom(x).ticks(Math.max(2, Math.floor((W - mg.l - mg.r) / 130))).tickSize(0).tickPadding(8).tickFormat(monthFmt));
  xa.selectAll('.tick text').each(function () { const bb = this.getBBox(); const tx = this.parentNode.transform.baseVal.consolidate(); const cx = tx ? tx.matrix.e : 0; if (cx + bb.x < 0 || cx + bb.x + bb.width > W) this.remove(); });
  svg.append('path').datum(S).style('fill', 'var(--pf-accent)').style('opacity', 0.12).attr('d', d3.area().x((s) => x(s.d)).y0((s) => y(s.p)).y1((s) => y(s.o)));
  const line = (key, color, width, dashed) => svg.append('path').datum(S).attr('fill', 'none').style('stroke', color).style('stroke-width', width).style('stroke-dasharray', dashed ? '5 4' : null).style('stroke-linejoin', 'round').attr('d', d3.line().x((s) => x(s.d)).y((s) => y(s[key])));
  line('i', 'var(--color-fg-muted)', 1.5, true);
  line('p', 'var(--color-bad)', 1.5, false);
  line('o', 'var(--color-ok)', 1.5, false);
  line('n', 'var(--pf-accent)', 2.5, false);
  const lg = document.createElement('div'); lg.className = 'pf-legend';
  [['Optimiste', 'var(--color-ok)', false], ['Normal', 'var(--pf-accent)', false], ['Pessimiste', 'var(--color-bad)', false], ['Argent investi', 'var(--color-fg-muted)', true]].forEach(([t, c, d]) => {
    const k = document.createElement('span'); const s = document.createElement('span'); s.className = 'pf-key'; s.style.borderTopColor = c; if (d) s.style.borderTopStyle = 'dashed'; k.append(s, document.createTextNode(t)); lg.append(k);
  });
  el.append(lg);
  const tip = document.createElement('div'); tip.className = 'pf-tip'; tip.hidden = true; el.append(tip);
  const guide = svg.append('line').attr('y1', mg.t).attr('y2', H - mg.b).style('stroke', 'var(--cds-chart-reference)').style('display', 'none');
  const bis = d3.bisector((s) => s.d).center;
  const showP = (ev) => {
      const [px] = d3.pointer(ev, svg.node()); const s = S[bis(S, x.invert(px))];
      guide.style('display', null).attr('x1', x(s.d)).attr('x2', x(s.d));
      const mk = (t, c) => { const d = document.createElement('div'); d.textContent = t; if (c) d.className = c; return d; };
      tip.replaceChildren(mk(s.m === 0 ? "Aujourd'hui" : monthFmt(s.d) + ' (dans ' + s.m + ' mois)', 'pf-tip-d'), mk('Optimiste : ' + F.money(s.o, cur), 'pf-up'), mk('Normal : ' + F.money(s.n, cur)), mk('Pessimiste : ' + F.money(s.p, cur), 'pf-down'), mk('Investi : ' + F.money(s.i, cur), 'pf-tip-d'));
      tip.hidden = false;
      const bw = el.clientWidth, tw = tip.offsetWidth, sx = (x(s.d) / W) * bw;
      tip.style.left = Math.min(Math.max(0, sx + 12), bw - tw) + 'px'; tip.style.top = '8px';
  };
  svg.append('rect').attr('x', mg.l).attr('y', 0).attr('width', W - mg.l - mg.r).attr('height', H).style('fill', 'transparent').style('touch-action', 'pan-y').style('cursor', 'crosshair')
    .on('pointerdown', showP).on('pointermove', showP)
    .on('pointerleave', (ev) => { if (ev.pointerType === 'mouse') { tip.hidden = true; guide.style('display', 'none'); } });
});
</script>

<script>
document.querySelectorAll('#pf-refresh').forEach((b) => b.addEventListener('click', () => window.pfLoad()));
window.pfLoad();
(() => {
  const deck = document.querySelector('.pf-deck');
  const screens = [...deck.querySelectorAll('.pf-screen')];
  const buttons = [...document.querySelectorAll('[data-screen]')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let current = -1;
  let frame = 0;

  function showCurrentScreen() {
    frame = 0;
    if (!deck.clientHeight) return;
    const index = Math.min(screens.length - 1, Math.max(0, Math.round(deck.scrollTop / deck.clientHeight)));
    if (index === current) return;
    current = index;
    screens.forEach((screen, i) => screen.classList.toggle('pf-writing', i === index));
    buttons.forEach((button, i) => {
      if (i === index) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    });
  }

  function update() {
    if (!frame) frame = requestAnimationFrame(showCurrentScreen);
  }

  buttons.forEach((button, i) => button.addEventListener('click', () => {
    screens[i].scrollIntoView({ block: 'start', behavior: reducedMotion.matches ? 'instant' : 'smooth' });
  }));
  deck.addEventListener('scroll', update, { passive: true });
  new ResizeObserver(update).observe(deck);
  update();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>


<script>
/* Pas de caractères spéciaux : la police digitale n'a ni accents ni symboles. On les remplace partout, même dans ce qui s'affiche plus tard. */
window.pfPlain = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '')
  .replace(/[−–—]/g, '-').replace(/[·•]/g, '-').replace(/[‘’]/g, "'")
  .replace(/[«»“”]/g, '"').replace(/…/g, '...').replace(/↻\s?/g, '')
  .replace(/€/g, 'EUR').replace(/[  ]/g, ' ').replace(/→/g, '->').replace(/—/g, '-')
  .replace(/œ/g, 'oe').replace(/æ/g, 'ae');
(function () {
  const fix = (node) => {
    if (node.nodeType === 3) {
      const p = node.parentNode; if (p && /^(SCRIPT|STYLE)$/.test(p.nodeName)) return;
      const t = node.nodeValue, q = window.pfPlain(t); if (q !== t) node.nodeValue = q; return;
    }
    if (node.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(node.nodeName)) return;
    for (const a of ['aria-label', 'title', 'placeholder']) { const v = node.getAttribute && node.getAttribute(a); if (v) { const q = window.pfPlain(v); if (q !== v) node.setAttribute(a, q); } }
    node.childNodes.forEach(fix);
  };
  const roots = [document.getElementById('dash-root'), document.getElementById('pf-setup')].filter(Boolean);
  roots.forEach(fix);
  const mo = new MutationObserver((ms) => { for (const m of ms) { if (m.type === 'characterData') fix(m.target); else m.addedNodes.forEach(fix); } });
  roots.forEach((r) => mo.observe(r, {childList: true, subtree: true, characterData: true}));
})();
</script>
